<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Domain for sale</title>
<meta name="description" content="This premium .si domain is available to buy.">
<style>
  :root { --bg:#0b0d10; --fg:#e9edf2; --mut:#8a94a3; --acc:#7cc4ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:16px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif;
         min-height:100vh; display:grid; place-items:center; padding:24px 16px; }
  main { max-width:560px; width:100%; text-align:center; }
  .tag { color:var(--mut); letter-spacing:.2em; text-transform:uppercase; font-size:12px; }
  h1 { font-size:clamp(44px,12vw,88px); font-weight:700; letter-spacing:-.03em; margin:12px 0 8px; word-break:break-all; }
  h1 span { color:var(--acc); }
  p { color:var(--mut); margin:0 auto 28px; max-width:420px; }
  a.btn { display:inline-block; background:var(--fg); color:var(--bg); text-decoration:none; font-weight:600;
          padding:14px 28px; border-radius:999px; }
  a.btn:hover { background:var(--acc); }
  footer { margin-top:40px; color:var(--mut); font-size:13px; }
</style>
</head>
<body>
<main>
  <div class="tag">Available for acquisition</div>
  <h1 id="name">kinema<span>.si</span></h1>
  <p>Short, brandable and ready for the superintelligence era. Serious offers considered.</p>
  <a class="btn" id="cta" href="#">Make an offer</a>
  <footer>Fast, secure transfer through escrow.</footer>
</main>
<script>
  // One page serves every domain: read the name from the address bar.
  var CONTACT = "domains@rosevari.com";
  var host = location.hostname.replace(/^www\./, "");
  var parts = host.split(".");
  if (parts.length >= 2 && parts[parts.length - 1] === "si") {
    var label = parts[parts.length - 2];
    document.getElementById("name").innerHTML = label + "<span>.si</span>";
    document.title = label + ".si is for sale";
  }
  var dom = document.getElementById("name").textContent;
  document.getElementById("cta").href = "mailto:" + CONTACT + "?subject=" +
    encodeURIComponent("Offer for " + dom);
</script>
</body>
</html>
